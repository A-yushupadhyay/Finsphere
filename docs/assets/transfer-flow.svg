<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="900" height="350" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Money transfer request flow</title>
  <desc id="d">A transfer request checks the session, validates input, loads both accounts, checks recipient and balance, then runs one Prisma transaction that debits, credits, writes ledger rows and notifications. A known gap is that the balance check happens before the transaction.</desc>
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .node{fill:#111a2e;stroke:#22304d;stroke-width:1.5}
    .name{font-size:15px;font-weight:600;fill:#e6edf3;text-anchor:middle}
    .cap{font-size:11px;fill:#8b9bb4;text-anchor:middle}
    .h{font-size:14px;fill:#8b9bb4}
    .note{font-size:12px;fill:#8b9bb4}
    .flow{stroke:#3b4a68;stroke-width:2;fill:none}
    .dash{stroke-dasharray:5 5;animation:dash 1.2s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-20}}
    @media (prefers-reduced-motion: reduce){.dash,.draw,.pulse{animation:none}}
    .t{font-size:12px;fill:#e6edf3}
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7a99"/></marker>
  </defs>
  <rect x="1" y="1" width="898" height="348" rx="14" fill="#0b1220" stroke="#22304d"/>
  <text class="sans h" x="28" y="34">POST /api/transfer</text>
  <g class="sans"><path class="flow" d="M148 102.0H164" marker-end="url(#ah)"/><path class="flow" d="M292 102.0H308" marker-end="url(#ah)"/><path class="flow" d="M436 102.0H452" marker-end="url(#ah)"/><path class="flow" d="M580 102.0H596" marker-end="url(#ah)"/><path class="flow" d="M724 102.0H740" marker-end="url(#ah)"/></g>
  <circle r="5" fill="#10b981"><animateMotion dur="7s" begin="0s" repeatCount="indefinite" path="M86 102.0H804" keyPoints="0;1;1" keyTimes="0;0.7;1" calcMode="linear"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.7;0.72;1" dur="7s" begin="0s" repeatCount="indefinite"/></circle>
  <g class="sans">
    <rect class="node" x="24" y="64" width="124" height="76" rx="10" style=""/><text class="cap" x="86.0" y="80" style="fill:#10b981">1</text><text class="name" x="86.0" y="104.0">Session</text><text class="cap" x="86.0" y="128">401 if signed out</text>
    <rect class="node" x="168" y="64" width="124" height="76" rx="10" style=""/><text class="cap" x="230.0" y="80" style="fill:#10b981">2</text><text class="name" x="230.0" y="104.0">Validate</text><text class="cap" x="230.0" y="128">email, amount > 0</text>
    <rect class="node" x="312" y="64" width="124" height="76" rx="10" style=""/><text class="cap" x="374.0" y="80" style="fill:#10b981">3</text><text class="name" x="374.0" y="104.0">Accounts</text><text class="cap" x="374.0" y="128">load both sides</text>
    <rect class="node" x="456" y="64" width="124" height="76" rx="10" style=""/><text class="cap" x="518.0" y="80" style="fill:#10b981">4</text><text class="name" x="518.0" y="104.0">Checks</text><text class="cap" x="518.0" y="128">self + balance</text>
    <rect class="node" x="600" y="64" width="124" height="76" rx="10" style="stroke:#10b981;"/><text class="cap" x="662.0" y="80" style="fill:#10b981">5</text><text class="name" x="662.0" y="104.0">Transaction</text><text class="cap" x="662.0" y="128">atomic batch</text>
    <rect class="node" x="744" y="64" width="124" height="76" rx="10" style=""/><text class="cap" x="806.0" y="80" style="fill:#10b981">6</text><text class="name" x="806.0" y="104.0">Response</text><text class="cap" x="806.0" y="128">success or error</text>
  </g>
  <rect x="24" y="170" width="410" height="148" rx="10" fill="#111a2e" stroke="#10b981"/>
  <text class="sans" x="42" y="196" font-size="14" font-weight="700" fill="#10b981">Inside one Prisma $transaction</text>
  <text class="sans t" x="42" y="220">- debit the sender's balance</text>
  <text class="sans t" x="42" y="240">- credit the recipient's balance</text>
  <text class="sans t" x="42" y="260">- write two ledger rows (debit and credit)</text>
  <text class="sans t" x="42" y="280">- create two notifications</text>
  <text class="sans t" x="42" y="300">If any step fails, none of them are applied.</text>
  <rect x="466" y="170" width="410" height="148" rx="10" fill="#111a2e" stroke="#f59e0b" stroke-dasharray="6 4"/>
  <text class="sans" x="484" y="196" font-size="14" font-weight="700" fill="#f59e0b">Known gap (documented in the code)</text>
  <text class="sans t" x="484" y="220">The balance is read before the transaction starts,</text>
  <text class="sans t" x="484" y="240">so two simultaneous transfers could both pass the</text>
  <text class="sans t" x="484" y="260">funds check. Possible fix: a conditional atomic update</text>
  <text class="sans t" x="484" y="280">or serializable isolation, and money stored as integer</text>
  <text class="sans t" x="484" y="300">minor units or Decimal instead of Float.</text>
  <text class="sans note" x="28" y="338">Demo money only: new accounts start with a simulated balance.</text>
</svg>
