<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 335" width="900" height="335" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">FinSphere architecture</title>
  <desc id="d">A browser request passes through Next.js middleware, which checks the NextAuth session and admin role, to API routes. API routes use Prisma to read and write PostgreSQL, upload KYC documents to Cloudinary, and call a Socket.IO server that currently only works locally.</desc>
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .node{fill:#111a2e;stroke:#22304d;stroke-width:1.5}
    .name{font-size:15px;font-weight:600;fill:#e6edf3;text-anchor:middle}
    .cap{font-size:11px;fill:#8b9bb4;text-anchor:middle}
    .h{font-size:14px;fill:#8b9bb4}
    .note{font-size:12px;fill:#8b9bb4}
    .flow{stroke:#3b4a68;stroke-width:2;fill:none}
    .dash{stroke-dasharray:5 5;animation:dash 1.2s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-20}}
    @media (prefers-reduced-motion: reduce){.dash,.draw,.pulse{animation:none}}
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7a99"/></marker>
  </defs>
  <rect x="1" y="1" width="898" height="333" rx="14" fill="#0b1220" stroke="#22304d"/>
  <text class="sans h" x="28" y="34">Request flow (solid = implemented, dashed amber = partial)</text>
  <g class="sans"><path class="flow" d="M164 99.0H192" marker-end="url(#ah)"/><path class="flow" d="M336 99.0H364" marker-end="url(#ah)"/><path class="flow" d="M508 99.0H536" marker-end="url(#ah)"/><path class="flow" d="M680 99.0H708" marker-end="url(#ah)"/><path class="flow dash" d="M266 200V138" marker-end="url(#ah)" style="stroke:#3b4a68"/><path class="flow dash" d="M420 138V200" marker-end="url(#ah)" style="stroke:#3b4a68"/><path class="flow dash" d="M470 138V168H610V200" marker-end="url(#ah)" style="stroke:#f59e0b"/></g>
  <circle r="5" fill="#10b981"><animateMotion dur="8s" begin="0s" repeatCount="indefinite" path="M94 99.0H782" keyPoints="0;1;1" keyTimes="0;0.6;1" calcMode="linear"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.6;0.62;1" dur="8s" begin="0s" repeatCount="indefinite"/></circle>
  <circle r="5" fill="#14b8a6"><animateMotion dur="8s" begin="4s" repeatCount="indefinite" path="M94 99.0H782" keyPoints="0;1;1" keyTimes="0;0.6;1" calcMode="linear"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.6;0.62;1" dur="8s" begin="4s" repeatCount="indefinite"/></circle>
  <g class="sans">
    <rect class="node" x="24" y="64" width="140" height="70" rx="10" style=""/><text class="name" x="94.0" y="95.0">Browser</text><text class="cap" x="94.0" y="122">React 19 · Next.js pages</text>
    <rect class="node" x="196" y="64" width="140" height="70" rx="10" style=""/><text class="name" x="266.0" y="95.0">Middleware</text><text class="cap" x="266.0" y="122">session + admin gate</text>
    <rect class="node" x="368" y="64" width="140" height="70" rx="10" style="stroke:#10b981;"/><text class="name" x="438.0" y="95.0">API routes</text><text class="cap" x="438.0" y="122">transfer · loan · KYC</text>
    <rect class="node" x="540" y="64" width="140" height="70" rx="10" style=""/><text class="name" x="610.0" y="95.0">Prisma</text><text class="cap" x="610.0" y="122">ORM · $transaction</text>
    <rect class="node" x="712" y="64" width="140" height="70" rx="10" style=""/><text class="name" x="782.0" y="95.0">PostgreSQL</text><text class="cap" x="782.0" y="122">relational data</text>
    <rect class="node" x="196" y="204" width="140" height="70" rx="10" style=""/><text class="name" x="266.0" y="235.0">NextAuth</text><text class="cap" x="266.0" y="262">Google OAuth · JWT</text>
    <rect class="node" x="368" y="204" width="140" height="70" rx="10" style=""/><text class="name" x="438.0" y="235.0">Cloudinary</text><text class="cap" x="438.0" y="262">KYC document upload</text>
    <rect class="node" x="540" y="204" width="140" height="70" rx="10" style="stroke:#f59e0b;stroke-dasharray:6 4;"/><text class="name" x="610.0" y="235.0">Socket.IO</text><text class="cap" x="610.0" y="262">local only (stub)</text>
  </g>
  <text class="sans note" x="28" y="320">Hosted on Vercel; the database is reached through a DATABASE_URL secret. The Socket.IO server is not deployed with the Vercel app.</text>
</svg>
