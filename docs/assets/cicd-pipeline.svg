<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 315" width="900" height="315" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">CI/CD workflow</title>
  <desc id="d">The GitHub Actions workflow runs on every push to main: checkout, Node 18 setup, npm install, prisma db push against the database, and a production deploy to Vercel. Lint, type-check, build and tests are not part of the workflow yet.</desc>
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .node{fill:#111a2e;stroke:#22304d;stroke-width:1.5}
    .name{font-size:15px;font-weight:600;fill:#e6edf3;text-anchor:middle}
    .cap{font-size:11px;fill:#8b9bb4;text-anchor:middle}
    .h{font-size:14px;fill:#8b9bb4}
    .note{font-size:12px;fill:#8b9bb4}
    .flow{stroke:#3b4a68;stroke-width:2;fill:none}
    .dash{stroke-dasharray:5 5;animation:dash 1.2s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-20}}
    @media (prefers-reduced-motion: reduce){.dash,.draw,.pulse{animation:none}}
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7a99"/></marker>
  </defs>
  <rect x="1" y="1" width="898" height="313" rx="14" fill="#0b1220" stroke="#22304d"/>
  <text class="sans h" x="28" y="34">.github/workflows/deploy.yml: on push to main</text>
  <g class="sans"><path class="flow" d="M174 100.0H195" marker-end="url(#ah)"/><path class="flow" d="M349 100.0H370" marker-end="url(#ah)"/><path class="flow" d="M524 100.0H545" marker-end="url(#ah)"/><path class="flow" d="M699 100.0H720" marker-end="url(#ah)"/></g>
  <circle r="5" fill="#10b981"><animateMotion dur="7s" begin="0s" repeatCount="indefinite" path="M99 100.0H799" keyPoints="0;1;1" keyTimes="0;0.7;1" calcMode="linear"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.7;0.72;1" dur="7s" begin="0s" repeatCount="indefinite"/></circle>
  <g class="sans">
    <rect class="node" x="24" y="62" width="150" height="76" rx="10" style=""/><text class="name" x="99.0" y="96.0">Push to main</text><text class="cap" x="99.0" y="126">trigger</text>
    <rect class="node" x="199" y="62" width="150" height="76" rx="10" style=""/><text class="name" x="274.0" y="96.0">Checkout</text><text class="cap" x="274.0" y="126">actions/checkout</text>
    <rect class="node" x="374" y="62" width="150" height="76" rx="10" style=""/><text class="name" x="449.0" y="96.0">Node 18 + npm</text><text class="cap" x="449.0" y="126">npm install</text>
    <rect class="node" x="549" y="62" width="150" height="76" rx="10" style="stroke:#f59e0b;"/><text class="name" x="624.0" y="96.0">prisma db push</text><text class="cap" x="624.0" y="126">schema to database</text>
    <rect class="node" x="724" y="62" width="150" height="76" rx="10" style="stroke:#10b981;"/><text class="name" x="799.0" y="96.0">Vercel deploy</text><text class="cap" x="799.0" y="126">pull + deploy --prod</text>
  </g>
  <text class="sans" x="624" y="162" text-anchor="middle" font-size="11" fill="#f59e0b">runs on every push</text>
  <text class="sans h" x="28" y="200">Not in the pipeline yet</text>
  <g class="sans"><rect x="24" y="212" width="200" height="44" rx="10" fill="none" stroke="#8b9bb4" stroke-dasharray="6 4"/><text x="124" y="239" text-anchor="middle" font-size="14" fill="#8b9bb4">next lint</text></g>
  <g class="sans"><rect x="238" y="212" width="200" height="44" rx="10" fill="none" stroke="#8b9bb4" stroke-dasharray="6 4"/><text x="338" y="239" text-anchor="middle" font-size="14" fill="#8b9bb4">type-check</text></g>
  <g class="sans"><rect x="452" y="212" width="200" height="44" rx="10" fill="none" stroke="#8b9bb4" stroke-dasharray="6 4"/><text x="552" y="239" text-anchor="middle" font-size="14" fill="#8b9bb4">next build</text></g>
  <g class="sans"><rect x="666" y="212" width="200" height="44" rx="10" fill="none" stroke="#8b9bb4" stroke-dasharray="6 4"/><text x="766" y="239" text-anchor="middle" font-size="14" fill="#8b9bb4">automated tests</text></g>
  <text class="sans note" x="28" y="280">Vercel builds the app during deploy, but nothing gates the deploy on lint, types or tests.</text>
  <text class="sans note" x="28" y="298">Production schema changes would normally use prisma migrate deploy instead of db push.</text>
</svg>
