<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">FinSphere: Smart Banking Platform</title>
  <desc id="d">Project banner for FinSphere, a banking-style web application built with Next.js, TypeScript, Prisma and PostgreSQL, with an illustrative animated line chart.</desc>
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .node{fill:#111a2e;stroke:#22304d;stroke-width:1.5}
    .name{font-size:15px;font-weight:600;fill:#e6edf3;text-anchor:middle}
    .cap{font-size:11px;fill:#8b9bb4;text-anchor:middle}
    .h{font-size:14px;fill:#8b9bb4}
    .note{font-size:12px;fill:#8b9bb4}
    .flow{stroke:#3b4a68;stroke-width:2;fill:none}
    .dash{stroke-dasharray:5 5;animation:dash 1.2s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-20}}
    @media (prefers-reduced-motion: reduce){.dash,.draw,.pulse{animation:none}}
    .draw{stroke-dasharray:420;stroke-dashoffset:0;animation:draw 2.4s ease-out backwards}
    @keyframes draw{from{stroke-dashoffset:420}to{stroke-dashoffset:0}}
    .pulse{animation:pulse 2s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  </style>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#0f2a2e"/></linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#10b981" stop-opacity=".28"/><stop offset="1" stop-color="#10b981" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#8b9bb4" stroke-opacity=".07"/></pattern>
  </defs>
  <rect x="1" y="1" width="898" height="258" rx="14" fill="url(#g)" stroke="#22304d"/>
  <rect x="1" y="1" width="898" height="258" rx="14" fill="url(#grid)"/>
  <text class="sans" x="48" y="96" font-size="54" font-weight="800" fill="#e6edf3">FinSphere</text>
  <text class="sans" x="50" y="128" font-size="22" fill="#10b981" font-weight="600">Smart Banking Platform</text>
  <text class="sans" x="50" y="156" font-size="14" fill="#8b9bb4">Accounts, transfers, KYC, loans and an admin console.</text>
  <g class="sans"><rect x="50" y="186" width="102" height="28" rx="14" fill="#111a2e" stroke="#22304d"/><text x="101" y="205" text-anchor="middle" font-size="12.5" fill="#e6edf3">Next.js 15</text></g>
  <g class="sans"><rect x="162.0" y="186" width="102" height="28" rx="14" fill="#111a2e" stroke="#22304d"/><text x="213" y="205" text-anchor="middle" font-size="12.5" fill="#e6edf3">TypeScript</text></g>
  <g class="sans"><rect x="274.0" y="186" width="72" height="28" rx="14" fill="#111a2e" stroke="#22304d"/><text x="310" y="205" text-anchor="middle" font-size="12.5" fill="#e6edf3">Prisma</text></g>
  <g class="sans"><rect x="355.6" y="186" width="102" height="28" rx="14" fill="#111a2e" stroke="#22304d"/><text x="407" y="205" text-anchor="middle" font-size="12.5" fill="#e6edf3">PostgreSQL</text></g>
  <g class="sans"><rect x="467.6" y="186" width="87" height="28" rx="14" fill="#111a2e" stroke="#22304d"/><text x="511" y="205" text-anchor="middle" font-size="12.5" fill="#e6edf3">NextAuth</text></g>
  <polygon points="560,200 560,170 600,156 640,162 680,128 720,138 760,100 800,110 860,64 860,200" fill="url(#area)"/>
  <polyline class="draw" points="560,170 600,156 640,162 680,128 720,138 760,100 800,110 860,64" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="pulse" cx="860" cy="64" r="6" fill="#10b981"/>
  <text class="sans" x="860" y="236" text-anchor="end" font-size="11" fill="#8b9bb4">illustrative graphic, not real data</text>
</svg>
